name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.35.4

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: APK signed with a throwaway debug key, it will not update previous installs."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter pub get
      # One APK per ABI: the universal APK carries three copies of the Flutter engine.
      - run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --obfuscate --split-debug-info=build/symbols
      - run: |
          out=build/app/outputs/flutter-apk
          mv $out/app-arm64-v8a-release.apk "tonex-tweaker-$GITHUB_REF_NAME-arm64.apk"
          mv $out/app-armeabi-v7a-release.apk "tonex-tweaker-$GITHUB_REF_NAME-armv7.apk"

      # Needed to symbolize obfuscated stack traces (flutter symbolize).
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.ref_name }}
          path: build/symbols
          retention-days: 90

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: tonex-tweaker-${{ github.ref_name }}-*.apk
          generate_release_notes: true
